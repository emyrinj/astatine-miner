name: Rust CI

on:
  push:
    branches: [main]
    tags: ["v0.1.0-testnet.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_rehearsal:
        description: Run the unsigned release artifact and Windows package rehearsal without creating a tag
        required: true
        default: false
        type: boolean
      release_tag:
        description: Testnet package version used by the nonpublishing rehearsal
        required: true
        default: v0.1.0-testnet.13
        type: string

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.94.1"

jobs:
  native-checks:
    name: Native checks (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: astatine
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary: astatine
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            binary: astatine
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            binary: astatine
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: astatine.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Verify release tag matches Cargo package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk -F'"' '/^version =/ { print $2; exit }' Cargo.toml)"
          test "v$package_version" = "$GITHUB_REF_NAME"
      - name: Verify workflow-dispatch rehearsal version
        if: github.event_name == 'workflow_dispatch' && inputs.release_rehearsal
        shell: bash
        env:
          RELEASE_REHEARSAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          package_version="$(awk -F'"' '/^version =/ { print $2; exit }' Cargo.toml)"
          test "v$package_version" = "$RELEASE_REHEARSAL_TAG"
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | awk '$1 == "host:" { print $2 }')"
          echo "Rust host: $host"
          test "$host" = "${{ matrix.target }}"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --locked
      - name: Unit tests
        run: cargo test --locked
      - name: Unix installer downgrade checks
        shell: bash
        run: sh support/test-install-unix-version.sh
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native release build
        run: cargo build --locked --release
      - name: Native executable smoke tests
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" --help >/dev/null
          "$binary" mine --help >/dev/null
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            file "$binary"
            ldd "$binary"
          elif [[ "${{ matrix.target }}" == *apple* ]]; then
            file "$binary"
            otool -L "$binary"
          fi
      - name: Validate documented Windows installer syntax
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $Readme = Get-Content README.md -Raw
          $CodeBlocks = [regex]::Matches($Readme, '(?s)```powershell\s*(.*?)\s*```')
          if ($CodeBlocks.Count -eq 0) { throw 'Windows PowerShell install instructions were not found' }
          $Scripts = @{
            'support/install-windows.ps1' = Get-Content support/install-windows.ps1 -Raw
            'support/update-windows.ps1' = Get-Content support/update-windows.ps1 -Raw
            'support/verify-public-install-windows.ps1' = Get-Content support/verify-public-install-windows.ps1 -Raw
            'support/test-unsigned-windows-package.ps1' = Get-Content support/test-unsigned-windows-package.ps1 -Raw
            'support/test-install-windows-version.ps1' = Get-Content support/test-install-windows-version.ps1 -Raw
          }
          for ($Index = 0; $Index -lt $CodeBlocks.Count; $Index++) {
            $Scripts["README.md PowerShell block $Index"] = $CodeBlocks[$Index].Groups[1].Value
          }
          foreach ($Name in $Scripts.Keys) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($Scripts[$Name], [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -ne 0) { throw "$Name`n$($Errors | Out-String)" }
          }
          & ./support/test-install-windows-version.ps1
      - name: Build Windows password prompt smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --locked --release --example windows_password_prompt
      - name: Windows hidden-password console smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $PromptExe = Join-Path $env:GITHUB_WORKSPACE 'target\release\examples\windows_password_prompt.exe'
          $Prompt = Start-Process -FilePath $PromptExe -PassThru -NoNewWindow
          if (-not $Prompt.WaitForExit(15000)) {
            $Prompt.Kill()
            throw 'Windows hidden-password console smoke timed out'
          }
          if ($Prompt.ExitCode -ne 0) { throw "Windows hidden-password console smoke failed (exit code $($Prompt.ExitCode))" }
      - name: Upload native release executable
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: astatine-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  attest-native-release-binaries:
    name: Attest tested native release binaries
    if: startsWith(github.ref, 'refs/tags/v0.1.0-testnet.') || (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal)
    needs: [native-checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          path: ${{ runner.temp }}/native-binaries
      - name: Attest binaries emitted by the tested platform matrix
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/native-binaries/astatine-aarch64-apple-darwin/astatine
            ${{ runner.temp }}/native-binaries/astatine-x86_64-apple-darwin/astatine
            ${{ runner.temp }}/native-binaries/astatine-x86_64-unknown-linux-gnu/astatine
            ${{ runner.temp }}/native-binaries/astatine-aarch64-unknown-linux-gnu/astatine
            ${{ runner.temp }}/native-binaries/astatine-x86_64-pc-windows-msvc/astatine.exe

  dependency-policy:
    name: Dependency, advisory, and license checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Require immutable full-SHA workflow action references
        run: python3 support/check_workflow_pins.py
      - name: Rehearse signed release validation with synthetic artifacts and a temporary key
        run: python3 support/release_artifacts.py self-test
      - name: Verify exact repository identity pins
        run: python3 support/check_release_identity.py
      - name: Verify the active owner public-key pin set
        run: python3 support/release_public_key.py check
      - name: Rehearse public-key pin synchronization with a synthetic key
        run: python3 support/release_public_key.py self-test
      - name: Test provenance validation with synthetic metadata
        run: python3 support/verify_release_provenance.py --self-test
      - name: Rehearse offline signing with synthetic keys only
        run: python3 support/offline_sign_release.py --self-test
      - name: Rehearse signature-gated manual publication with synthetic assets
        run: python3 support/publish_signed_release.py --self-test
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install pinned dependency validation tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo install cargo-audit --locked --version 0.22.2
      - name: Validate dependency policies
        run: cargo deny check
      - name: Keep inactive vulnerable optional package out of the active graph
        run: |
          set -euo pipefail
          cargo tree --locked --all-features --target all -i crypto-bigint@0.5.5 > "$RUNNER_TEMP/crypto-bigint-0.5.5-tree.txt" 2>&1
          python3 - "$RUNNER_TEMP/crypto-bigint-0.5.5-tree.txt" <<'PY'
          import pathlib
          import sys

          tree = pathlib.Path(sys.argv[1]).read_text()
          assert "crypto-bigint v0.5.5" not in tree, "RUSTSEC-2026-0387 package entered the active all-features/all-targets graph"
          PY
      - name: Audit locked dependencies
        run: cargo audit --ignore RUSTSEC-2026-0387
      - name: Regenerate third-party license notices
        run: |
          cargo about generate --locked about.hbs --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"
          cmp THIRD_PARTY_LICENSES.md "$RUNNER_TEMP/THIRD_PARTY_LICENSES.md"

  anvil-integration:
    name: Genesis, proof, finalization, reorg, and reward integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      # The upstream source repos are private; CI uses checked-in creation bytecode
      # and verifies each fixture's pinned source commit before running Anvil.
      - name: Verify pinned Anvil fixture provenance
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          fixtures = pathlib.Path("tests/fixtures")
          expected_sources = {
              "AstatineMiner.json": "eb9ea498ed4da10536cd6b4d5d8b55cf38e8aa30",
              "MockAST.json": "eb9ea498ed4da10536cd6b4d5d8b55cf38e8aa30",
              "AstatineGenesisCoordinator.json": "54588aa7b020cd7e49fa2275a560cde8138dd707",
          }
          for name, expected_commit in expected_sources.items():
              actual_commit = json.loads((fixtures / name).read_text())["source_commit"]
              assert actual_commit == expected_commit, (name, actual_commit, expected_commit)
          PY
      - name: Install pinned Rust toolchain components
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - name: Install Foundry v1.8.7 from its digest-pinned Linux release asset
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/foundry_v1.8.7_linux_amd64.tar.gz"
          curl --fail --show-error --location --retry 2 \
            https://github.com/foundry-rs/foundry/releases/download/v1.8.7/foundry_v1.8.7_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            'ba470eb718e779e4b0e3f1520b5284231b1bf98e9a39de07fb8f77ed70525bcf' \
            "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/foundry-v1.8.7"
          tar -xzf "$archive" -C "$RUNNER_TEMP/foundry-v1.8.7"
          test -x "$RUNNER_TEMP/foundry-v1.8.7/anvil"
          test -x "$RUNNER_TEMP/foundry-v1.8.7/forge"
          echo "$RUNNER_TEMP/foundry-v1.8.7" >> "$GITHUB_PATH"
      - name: Verify local EVM tools
        run: forge --version && anvil --version
      - name: Run all local Anvil lifecycle tests
        run: cargo test --release --locked -- --ignored --test-threads=1

  build-release-package:
    name: Build unsigned Testnet release packages
    if: startsWith(github.ref, 'refs/tags/v0.1.0-testnet.') || (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal)
    needs: [native-checks, attest-native-release-binaries, dependency-policy, anvil-integration]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal && inputs.release_tag) || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Require the release tag to identify current main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          test "$GITHUB_SHA" = "$main_sha"
      - name: Require the nonpublishing rehearsal to use this clean source commit
        if: github.event_name == 'workflow_dispatch' && inputs.release_rehearsal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          path: ${{ runner.temp }}/native-binaries
      - name: Assemble reproducible archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/native-binaries"
          package="$RUNNER_TEMP/testnet-package"
          mkdir -p \
            "$package/stage/macos-aarch64" \
            "$package/stage/macos-x86_64" \
            "$package/stage/linux-x86_64" \
            "$package/stage/linux-aarch64" \
            "$package/stage/windows-x86_64"

          install -m 0755 "$native/astatine-aarch64-apple-darwin/astatine" "$package/stage/macos-aarch64/astatine"
          install -m 0755 "$native/astatine-x86_64-apple-darwin/astatine" "$package/stage/macos-x86_64/astatine"
          install -m 0755 "$native/astatine-x86_64-unknown-linux-gnu/astatine" "$package/stage/linux-x86_64/astatine"
          install -m 0755 "$native/astatine-aarch64-unknown-linux-gnu/astatine" "$package/stage/linux-aarch64/astatine"
          install -m 0644 "$native/astatine-x86_64-pc-windows-msvc/astatine.exe" "$package/stage/windows-x86_64/astatine.exe"
          install -m 0755 "$native/astatine-aarch64-apple-darwin/astatine" "$package/astatine-macos-aarch64"
          install -m 0755 "$native/astatine-x86_64-apple-darwin/astatine" "$package/astatine-macos-x86_64"
          install -m 0755 "$native/astatine-x86_64-unknown-linux-gnu/astatine" "$package/astatine-linux-x86_64"
          install -m 0755 "$native/astatine-aarch64-unknown-linux-gnu/astatine" "$package/astatine-linux-aarch64"
          install -m 0644 "$native/astatine-x86_64-pc-windows-msvc/astatine.exe" "$package/astatine-windows-x86_64.exe"
          for stage in "$package"/stage/*; do
            install -m 0644 LICENSE-MIT THIRD_PARTY_LICENSES.md "$stage/"
          done
          install -m 0644 LICENSE-MIT THIRD_PARTY_LICENSES.md "$package/"

          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          for staged_file in "$package"/stage/*/*; do
            touch -m -d "@$source_date_epoch" "$staged_file"
          done
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -cf - -C "$package/stage/macos-aarch64" astatine LICENSE-MIT THIRD_PARTY_LICENSES.md | gzip -n > "$package/astatine-macos-aarch64.tar.gz"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -cf - -C "$package/stage/macos-x86_64" astatine LICENSE-MIT THIRD_PARTY_LICENSES.md | gzip -n > "$package/astatine-macos-x86_64.tar.gz"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -cf - -C "$package/stage/linux-x86_64" astatine LICENSE-MIT THIRD_PARTY_LICENSES.md | gzip -n > "$package/astatine-linux-x86_64.tar.gz"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner -cf - -C "$package/stage/linux-aarch64" astatine LICENSE-MIT THIRD_PARTY_LICENSES.md | gzip -n > "$package/astatine-linux-aarch64.tar.gz"
          (cd "$package/stage/windows-x86_64" && zip -X "$package/astatine-windows-x86_64.zip" astatine.exe LICENSE-MIT THIRD_PARTY_LICENSES.md)

          python3 - "$package" "$RELEASE_TAG" <<'PY'
          import hashlib
          import io
          import os
          import pathlib
          import sys
          import re

          root = pathlib.Path(sys.argv[1])
          tag = sys.argv[2]
          match = re.search(r'(?m)^version = "([^"]+)"$', pathlib.Path("Cargo.toml").read_text())
          assert match, "Cargo.toml package version is missing"
          version = match.group(1)
          assert tag == f"v{version}", f"tag {tag} does not match package version {version}"
          repository = pathlib.Path("support/release-repository.txt").read_text(encoding="ascii").strip()
          assert repository == os.environ["GITHUB_REPOSITORY"], "workflow repository does not match the pinned release identity"
          assets = {}
          for target in ("macos-aarch64", "macos-x86_64", "linux-aarch64", "linux-x86_64", "windows-x86_64"):
              binary = f"astatine-{target}.exe" if target == "windows-x86_64" else f"astatine-{target}"
              package = f"astatine-{target}.zip" if target == "windows-x86_64" else f"astatine-{target}.tar.gz"
              assets[f"binary.{target}"] = binary
              assets[f"package.{target}"] = package
          for filename in ("LICENSE-MIT", "THIRD_PARTY_LICENSES.md"):
              assets[f"license.{filename}"] = filename
          lines = [
              "astatine-update-manifest-v1",
              f"repository={repository}",
              "channel=testnet",
              f"version={version}",
          ]
          for key, filename in sorted(assets.items()):
              path = root / filename
              digest_builder = hashlib.sha256()
              with path.open("rb") as asset_file:
                  for chunk in iter(lambda: asset_file.read(1024 * 1024), b""):
                      digest_builder.update(chunk)
              digest = digest_builder.hexdigest()
              lines.append(f"asset.{key}={filename}|{digest}|{path.stat().st_size}")
          (root / "update-manifest.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          cd "$package"
          file stage/macos-aarch64/astatine stage/macos-x86_64/astatine \
            stage/linux-x86_64/astatine stage/linux-aarch64/astatine stage/windows-x86_64/astatine.exe
          tar -tzf astatine-macos-aarch64.tar.gz
          tar -tzf astatine-macos-x86_64.tar.gz
          tar -tzf astatine-linux-x86_64.tar.gz
          tar -tzf astatine-linux-aarch64.tar.gz
          unzip -l astatine-windows-x86_64.zip
          python3 - "$package" <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tarfile
          import zipfile

          root = pathlib.Path(sys.argv[1])
          source_root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          expected = {"LICENSE-MIT", "THIRD_PARTY_LICENSES.md"}
          architectures = {
              "macos-aarch64": ("astatine", "Mach-O 64-bit arm64 executable"),
              "macos-x86_64": ("astatine", "Mach-O 64-bit x86_64 executable"),
              "linux-x86_64": ("astatine", "ELF 64-bit LSB pie executable, x86-64"),
              "linux-aarch64": ("astatine", "ELF 64-bit LSB pie executable, ARM aarch64"),
              "windows-x86_64": ("astatine.exe", "PE32+ executable (console) x86-64"),
          }
          for stage, (binary_name, architecture) in architectures.items():
              binary = root / "stage" / stage / binary_name
              description = subprocess.check_output(["file", str(binary)], text=True)
              assert architecture in description, f"{binary}: {description}"
          for name in (
              "astatine-macos-aarch64.tar.gz",
              "astatine-macos-x86_64.tar.gz",
              "astatine-linux-x86_64.tar.gz",
              "astatine-linux-aarch64.tar.gz",
          ):
              with tarfile.open(root / name, "r:gz") as archive:
                  members = archive.getmembers()
                  assert {member.name for member in members} == expected | {"astatine"}, name
                  binary = next(member for member in members if member.name == "astatine")
                  assert binary.mode & 0o111, f"{name}: binary is not executable"
                  for filename in expected:
                      assert archive.extractfile(filename).read() == (source_root / filename).read_bytes()
          with zipfile.ZipFile(root / "astatine-windows-x86_64.zip") as archive:
              assert set(archive.namelist()) == expected | {"astatine.exe"}
              for filename in expected:
                  assert archive.read(filename) == (source_root / filename).read_bytes()
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: astatine-${{ env.RELEASE_TAG }}-unsigned-release-packages
          path: |
            ${{ runner.temp }}/testnet-package/astatine-macos-aarch64.tar.gz
            ${{ runner.temp }}/testnet-package/astatine-macos-x86_64.tar.gz
            ${{ runner.temp }}/testnet-package/astatine-linux-x86_64.tar.gz
            ${{ runner.temp }}/testnet-package/astatine-linux-aarch64.tar.gz
            ${{ runner.temp }}/testnet-package/astatine-windows-x86_64.zip
            ${{ runner.temp }}/testnet-package/astatine-macos-aarch64
            ${{ runner.temp }}/testnet-package/astatine-macos-x86_64
            ${{ runner.temp }}/testnet-package/astatine-linux-aarch64
            ${{ runner.temp }}/testnet-package/astatine-linux-x86_64
            ${{ runner.temp }}/testnet-package/astatine-windows-x86_64.exe
            ${{ runner.temp }}/testnet-package/LICENSE-MIT
            ${{ runner.temp }}/testnet-package/THIRD_PARTY_LICENSES.md
            ${{ runner.temp }}/testnet-package/update-manifest.txt
          if-no-files-found: error
          retention-days: 14

  attest-unsigned-release:
    name: Verify and attest unsigned Testnet release artifacts
    if: startsWith(github.ref, 'refs/tags/v0.1.0-testnet.') || (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal)
    needs: [build-release-package, attest-native-release-binaries]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal && inputs.release_tag) || github.ref_name }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - name: Require the release tag to identify current main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse FETCH_HEAD)"
      - name: Require the nonpublishing rehearsal to use this clean source commit
        if: github.event_name == 'workflow_dispatch' && inputs.release_rehearsal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: astatine-${{ env.RELEASE_TAG }}-unsigned-release-packages
          path: ${{ runner.temp }}/unsigned-testnet-package
      - name: Verify raw platform binaries against build attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/unsigned-testnet-package"
          for binary in \
            astatine-macos-aarch64 \
            astatine-macos-x86_64 \
            astatine-linux-x86_64 \
            astatine-linux-aarch64 \
            astatine-windows-x86_64.exe; do
            gh attestation verify "$package/$binary" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --deny-self-hosted-runners
          done
      - name: Validate transferred artifact and test substitution rejection
        shell: bash
        run: >-
          python3 support/release_artifacts.py verify-unsigned
          --root "$RUNNER_TEMP/unsigned-testnet-package"
          --tag "$RELEASE_TAG"
          --license-root "$GITHUB_WORKSPACE"
      - name: Attest validated unsigned release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # attest-build-provenance v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/unsigned-testnet-package/astatine-macos-aarch64.tar.gz
            ${{ runner.temp }}/unsigned-testnet-package/astatine-macos-x86_64.tar.gz
            ${{ runner.temp }}/unsigned-testnet-package/astatine-linux-aarch64.tar.gz
            ${{ runner.temp }}/unsigned-testnet-package/astatine-linux-x86_64.tar.gz
            ${{ runner.temp }}/unsigned-testnet-package/astatine-windows-x86_64.zip
            ${{ runner.temp }}/unsigned-testnet-package/astatine-macos-aarch64
            ${{ runner.temp }}/unsigned-testnet-package/astatine-macos-x86_64
            ${{ runner.temp }}/unsigned-testnet-package/astatine-linux-aarch64
            ${{ runner.temp }}/unsigned-testnet-package/astatine-linux-x86_64
            ${{ runner.temp }}/unsigned-testnet-package/astatine-windows-x86_64.exe
            ${{ runner.temp }}/unsigned-testnet-package/LICENSE-MIT
            ${{ runner.temp }}/unsigned-testnet-package/THIRD_PARTY_LICENSES.md
            ${{ runner.temp }}/unsigned-testnet-package/update-manifest.txt

  windows-unsigned-package-smoke:
    name: Verify and execute unsigned Windows package
    if: startsWith(github.ref, 'refs/tags/v0.1.0-testnet.') || (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal)
    needs: [attest-unsigned-release]
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_rehearsal && inputs.release_tag) || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: astatine-${{ env.RELEASE_TAG }}-unsigned-release-packages
          path: ${{ runner.temp }}/testnet-package
      - name: Verify and execute the Windows archive without administrator access
        shell: pwsh
        run: |
          & ./support/test-unsigned-windows-package.ps1 `
            -PackageDirectory (Join-Path $env:RUNNER_TEMP 'testnet-package') `
            -ReleaseTag $env:RELEASE_TAG `
            -Repository $env:GITHUB_REPOSITORY `
            -TemporaryDirectory $env:RUNNER_TEMP
