[package]
name = "astatine-cli-rust"
version = "0.1.0-testnet.13"
edition = "2024"
rust-version = "1.94.1"
description = "A native Rust CPU and GPU command-line miner for Astatine"
license = "MIT"

[[bin]]
name = "astatine"
path = "src/main.rs"

[dependencies]
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std"] }
alloy-rlp = "=0.3.16"
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
aes = "=0.9.3"
anyhow = "=1.0.103"
base64 = "=0.22.1"
bip32 = { version = "=0.6.0", default-features = false, features = ["alloc", "secp256k1"] }
bip39 = { version = "=3.0.0", default-features = false, features = ["rand", "std", "zeroize"] }
clap = { version = "=4.6.7", default-features = false, features = ["error-context", "help", "std", "usage"] }
crossterm = "=0.28.1"
ctr = "=0.10.1"
pbkdf2 = "=0.13.0"
pollster = "=0.4.0"
rand = "=0.8.6"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "crossterm_0_28"] }
rpassword = "=7.5.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
ring = "=0.17.14"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
scrypt = "=0.12.0"
sha2 = "=0.11.0"
subtle = "=2.6.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=1.1.8"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[patch.crates-io]
paste = { path = "support/paste-shim" }
